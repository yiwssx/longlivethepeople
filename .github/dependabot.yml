version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "ci"
      include: scope
