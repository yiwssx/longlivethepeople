version: 2

updates:
  # Only dependencies explicitly declared in package.json files are maintained.
  # Transitive dependencies remain owned by their direct parent packages.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    rebase-strategy: auto
    allow:
      - dependency-type: direct
    groups:
      react-frontend:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      socket-io:
        patterns:
          - "socket.io"
          - "socket.io-client"
        update-types:
          - minor
          - patch
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react-swc"
          - "typescript"
        update-types:
          - minor
          - patch
      vite-legacy:
        patterns:
          - "@vitejs/plugin-legacy"
        update-types:
          - patch
      server-types:
        patterns:
          - "@types/compression"
          - "@types/cors"
          - "@types/express"
          - "@types/node"
          - "@types/serve-favicon"
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - "supertest"
          - "@playwright/test"
          - "mongodb-memory-server"
        update-types:
          - minor
          - patch
      dev-orchestration:
        patterns:
          - "concurrently"
          - "cross-env"
          - "nodemon"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps"
      include: scope
