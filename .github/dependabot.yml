version: 2

updates:
  # npm workspaces share one root lockfile. Keep discovery at the repository root
  # so dependencies that span workspaces (notably Socket.IO client/server) can be
  # upgraded and verified together in a single PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    rebase-strategy: auto
    groups:
      react-frontend:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      socket-io:
        patterns:
          - "socket.io"
          - "socket.io-client"
        update-types:
          - minor
          - patch
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react-swc"
          - "typescript"
        update-types:
          - minor
          - patch
      vite-legacy:
        patterns:
          - "@vitejs/plugin-legacy"
        update-types:
          - patch
      server-types:
        patterns:
          - "@types/compression"
          - "@types/cors"
          - "@types/express"
          - "@types/node"
          - "@types/serve-favicon"
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - "supertest"
          - "@playwright/test"
          - "mongodb-memory-server"
        update-types:
          - minor
          - patch
      dev-orchestration:
        patterns:
          - "concurrently"
          - "cross-env"
          - "nodemon"
        update-types:
          - minor
          - patch
    # Keep Node typings aligned with the Node 24 production/runtime baseline.
    # A Node major upgrade must be planned together with deployment compatibility.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: scope
