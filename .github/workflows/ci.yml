name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check applications
        run: npm run typecheck

      - name: Build modern and legacy frontend bundles
        run: npm run build

      - name: Verify frontend build and CSP hashes
        run: node ./scripts/verify-frontend-build.mjs

      - name: Run backend tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify development runtime
        run: npm run test:dev

      - name: Run browser E2E tests
        run: npm run test:e2e:ci

      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high
