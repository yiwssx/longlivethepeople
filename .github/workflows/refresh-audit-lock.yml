name: Refresh audit lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/test-tooling-f273b28097

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/test-tooling-f273b28097

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only

      - name: Verify audit gate
        run: npm audit --audit-level=high

      - name: Ensure package manifests were not changed
        run: git diff --exit-code -- package.json apps/*/package.json

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock.json changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): refresh vulnerable transitive dependencies"
          git push origin HEAD:dependabot/npm_and_yarn/test-tooling-f273b28097
