name: Refresh security dependencies

on:
  push:
    branches:
      - agent/dependency-security-updates

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dependency-security-updates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Refresh direct security updates
        run: npm install mongoose@^9.7.2 morgan@^1.11.0 --save

      - name: Refresh transitive security updates
        run: npm update body-parser ws engine.io socket.io-adapter socket.io-parser qs form-data shell-quote brace-expansion

      - name: Run tests
        run: npm test

      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "Refresh security dependencies"
          git push
