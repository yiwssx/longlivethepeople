name: Dependency security refresh

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@v4
        with:
          ref: agent/dependency-security-updates
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Refresh direct dependencies
        run: npm install mongoose@^9.7.2 morgan@^1.11.0 --save

      - name: Refresh targeted transitive dependencies
        run: npm update body-parser ws engine.io socket.io-adapter socket.io-parser qs form-data shell-quote brace-expansion

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Run tests
        run: npm test

      - name: Verify no high-severity audit findings
        run: npm audit --audit-level=high

      - name: Commit dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "Refresh security dependencies"
          git push origin HEAD:agent/dependency-security-updates
