name: Dependabot auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  classify:
    name: Classify Dependabot update
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark verified dependency updates for automatic merge
        uses: actions/github-script@v8
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const label = 'dependencies-automerge';
            const updateType = process.env.UPDATE_TYPE || '';
            const dependencyType = process.env.DEPENDENCY_TYPE || '';
            const dependencyNames = process.env.DEPENDENCY_NAMES || '';
            const safeTypes = new Set([
              'version-update:semver-patch',
              'version-update:semver-minor',
            ]);
            const isDirectDependency = dependencyType.startsWith('direct');
            const isIndirectDependency = dependencyType === 'indirect';

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });
            const filenames = changedFiles.map((file) => file.filename);
            const isPackageManifest = (filename) => filename === 'package.json' || filename.endsWith('/package.json');
            const isPackageLock = (filename) => filename === 'package-lock.json';
            const hasPackageManifest = filenames.some(isPackageManifest);
            const hasPackageLock = filenames.some(isPackageLock);
            const onlyPackageFiles = filenames.length > 0 && filenames.every(
              (filename) => isPackageManifest(filename) || isPackageLock(filename),
            );
            const isLockfileOnly = hasPackageLock
              && !hasPackageManifest
              && filenames.every(isPackageLock);

            // @vitejs/plugin-legacy embeds fixed inline runtime snippets. Patch
            // releases can merge automatically because CI verifies generated CSP
            // hashes. Minor releases remain manual so browser-support changes get
            // an explicit review even when the build is green.
            const legacyPluginMinor = dependencyNames.includes('@vitejs/plugin-legacy')
              && updateType === 'version-update:semver-minor';

            // Direct patch/minor updates may change package.json, package-lock.json,
            // or both. Indirect updates are accepted only when they are lockfile-only.
            const directSafe = isDirectDependency && onlyPackageFiles;
            const indirectLockfileSafe = isIndirectDependency && isLockfileOnly;
            const isSafeUpdate = safeTypes.has(updateType)
              && !legacyPluginMinor
              && (directSafe || indirectLockfileSafe);

            if (isSafeUpdate) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: '0E8A16',
                  description: 'Auto-merge verified Dependabot patch/minor package updates after CI passes',
                });
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [label],
              });
              core.notice(
                `Marked ${dependencyType || 'unknown'} ${updateType} dependency update for auto-merge after CI.`,
              );
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            core.notice(
              `Leaving update for manual review: updateType=${updateType || 'unknown'}, dependencyType=${dependencyType || 'unknown'}, manifests=${hasPackageManifest}, lockfileOnly=${isLockfileOnly}, packageFilesOnly=${onlyPackageFiles}.`,
            );

  merge:
    name: Merge verified Dependabot update
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest

    steps:
      - name: Merge only a verified Dependabot dependency PR
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const prNumber = run.pull_requests[0].number;
            const autoMergeLabel = 'dependencies-automerge';

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const labels = new Set(pr.labels.map((label) => label.name));
            const isDependabot = pr.user?.login === 'dependabot[bot]';
            const isDependabotBranch = pr.head?.ref?.startsWith('dependabot/');
            const isSameRepository = pr.head?.repo?.full_name === `${owner}/${repo}`;
            const targetsMain = pr.base?.ref === 'main';
            const isOpen = pr.state === 'open' && !pr.draft;
            const isMarkedSafe = labels.has(autoMergeLabel);

            if (!isDependabot || !isDependabotBranch || !isSameRepository || !targetsMain || !isOpen || !isMarkedSafe) {
              core.notice(`PR #${prNumber} did not satisfy the Dependabot auto-merge policy.`);
              return;
            }

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const filenames = changedFiles.map((file) => file.filename);
            const isPackageManifest = (filename) => filename === 'package.json' || filename.endsWith('/package.json');
            const isPackageLock = (filename) => filename === 'package-lock.json';
            const hasPackageManifest = filenames.some(isPackageManifest);
            const hasPackageLock = filenames.some(isPackageLock);
            const onlyPackageFiles = filenames.length > 0 && filenames.every(
              (filename) => isPackageManifest(filename) || isPackageLock(filename),
            );

            if (!onlyPackageFiles || (!hasPackageManifest && !hasPackageLock)) {
              core.notice(`PR #${prNumber} no longer satisfies the dependency file policy.`);
              return;
            }

            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: 'squash',
              sha: pr.head.sha,
              commit_title: `${pr.title} (#${prNumber})`,
            });

            if (!result.data.merged) {
              core.setFailed(`GitHub refused to merge PR #${prNumber}: ${result.data.message}`);
              return;
            }

            core.notice(`Merged verified Dependabot dependency PR #${prNumber} after CI passed.`);
