name: Sync React frontend dependencies

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.head_ref == 'agent/react-vite-frontend' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout React branch
        uses: actions/checkout@v7
        with:
          ref: agent/react-vite-frontend

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install React runtime dependencies
        run: |
          npm uninstall ejs
          npm install react@latest react-dom@latest socket.io-client@^4.8.3

      - name: Install frontend development toolchain
        run: npm install --save-dev vite@latest @vitejs/plugin-react@latest @vitejs/plugin-legacy@latest typescript@latest @types/react@latest @types/react-dom@latest concurrently@latest

      - name: Update package scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts = {
            start: 'node ./src/server.js',
            dev: 'concurrently -k -n server,client "npm:dev:server" "npm:dev:client"',
            'dev:server': 'cross-env NODE_ENV=development node ./src/server.js',
            'dev:client': 'vite',
            'watch:dev': 'npm run dev',
            build: 'vite build',
            typecheck: 'tsc -p frontend/tsconfig.json --noEmit',
            test: 'cross-env NODE_ENV=test jest --runInBand',
            'test:e2e': 'npm run build && cross-env NODE_ENV=test playwright test',
            'test:e2e:ci': 'cross-env NODE_ENV=test playwright test',
            'test:all': 'npm run typecheck && npm run build && npm run test && npm run test:e2e:ci'
          };
          pkg.nodemonConfig = {
            watch: ['src'],
            ignore: ['**/__tests__/**', '*.test.js', '*.spec.js']
          };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync React frontend dependency lockfile"
          git push
