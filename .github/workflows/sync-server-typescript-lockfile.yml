name: Sync TypeScript migration lockfile

on:
  push:
    branches:
      - refactor/phase3-server-typescript

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: refactor/phase3-server-typescript

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Regenerate npm workspace lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync server TypeScript dependency lockfile"
          git push
