name: Archive lockfile refresh

on:
  push:
    branches:
      - agent/archive-architecture-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/archive-architecture-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Sync runtime dependencies and add Playwright
        run: npm install --package-lock-only --save-dev @playwright/test@latest

      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh archive dependency lockfile"
          git push origin HEAD:agent/archive-architecture-hardening
