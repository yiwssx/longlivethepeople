name: Archive lockfile refresh

on:
  push:
    branches:
      - agent/archive-architecture-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/archive-architecture-hardening

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Sync lockfile metadata
        run: npm install --package-lock-only

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync Node 24 lockfile metadata"
          git push origin HEAD:agent/archive-architecture-hardening
